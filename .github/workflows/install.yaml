name: Install TradeInvest v1.1

# One-click installer / updater. Actions -> "Install TradeInvest v1.0" -> Run workflow.
# 1) unpacks the new code  2) runs a canary self-test (if it fails, NOTHING changes)
# 3) saves the code  4) moves media hosting to the history-less `media` branch
# 5) keeps the old bot off. Publishing continues on the normal schedule.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write
  pages: write

