name: Install TradeInvest Reels (run once)

# One-click installer. Actions -> "Install TradeInvest Reels" -> Run workflow.
# It puts the reels system in place, fetches fonts and music, turns off the
# old daily bot and starts a first test reel. Safe to run again.
