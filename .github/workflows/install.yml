              old = {}
          new = json.load(open("reels/state.json"))
          if "published" in old:          # already a v1 state: keep everything
              new = old
          else:                           # first v1 install: the course starts fresh, keep news history
              for k in ("posted_links", "used_broll"):
                  if k in old:
                      new[k] = old[k]
          json.dump(new, open("reels/state.json", "w"), ensure_ascii=False, indent=1)
          print("course_index =", new.get("course_index"))
