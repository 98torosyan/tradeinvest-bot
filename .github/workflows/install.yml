      - name: Tidy the repository
        run: |
          git rm -q -r -f --ignore-unmatch docs content data video visuals tests sample-output main.py \
            scripts/generate_highlight_covers.py scripts/publish_to_instagram.py __init__.py builder.py gemini.py \
            lessons.json news.py palettes.py render.py run.py state.json state.py engine.js fonts.css styles.css \
            autofahren.mp3 cbpd.mp3 delayed-flight.mp3 hiphop.mp3 memories.mp3 workout.mp3
          rm -rf docs
          cat > requirements.txt <<'REQ'
          requests>=2.31
          pynacl>=1.5
          REQ
          mkdir -p control && touch control/.keep

      - name: Fonts and music
        run: |
          mkdir -p reels/assets/fonts /tmp/f && cd /tmp/f
          npm pack --silent @fontsource/noto-sans-armenian@5.3.0 @fontsource/noto-serif-armenian@5.3.0
          for t in *.tgz; do mkdir -p "${t%.tgz}" && tar -xzf "$t" -C "${t%.tgz}"; done
          cd "$GITHUB_WORKSPACE"
          for w in 400 500 600 700 800; do for s in armenian latin; do
            cp /tmp/f/fontsource-noto-sans-armenian-*/package/files/noto-sans-armenian-$s-$w-normal.woff2 reels/assets/fonts/; done; done
          for w in 400 700 800; do for s in armenian latin; do
            cp /tmp/f/fontsource-noto-serif-armenian-*/package/files/noto-serif-armenian-$s-$w-normal.woff2 reels/assets/fonts/; done; done
          # Armenian spelling dictionary (martakert/hyspell, CC0) and TTF fonts for Manim
          mkdir -p reels/assets/dict reels/assets/ttf
          curl -sfL -o reels/assets/dict/hy.aff https://raw.githubusercontent.com/martakert/hyspell/main/hy_AM.aff
          curl -sfL -o reels/assets/dict/hy.dic https://raw.githubusercontent.com/martakert/hyspell/main/hy_AM.dic
          curl -sfL -o reels/assets/ttf/NotoSansArmenian.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarmenian/NotoSansArmenian%5Bwdth%2Cwght%5D.ttf"
          curl -sfL -o reels/assets/ttf/NotoSerifArmenian.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notoserifarmenian/NotoSerifArmenian%5Bwdth%2Cwght%5D.ttf"
          mkdir -p reels/assets/lottie
          ls reels/assets/music/lesson reels/assets/music/news reels/assets/dict reels/assets/ttf

      - name: Canary self-test (nothing is saved if this fails)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg hunspell libcairo2-dev libpango1.0-dev pkg-config
          mkdir -p ~/.fonts && cp reels/assets/ttf/*.ttf ~/.fonts/ && fc-cache -f >/dev/null
          pip install -q -r reels/requirements.txt
          python -m playwright install --with-deps chromium
          python -m reels.selftest

      - name: Save the new version
        run: |
          git config user.name "tradeinvest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A .
          git commit -q -m "Install TradeInvest v1.0" || echo "nothing to commit"
          git push

      - name: Move media hosting to the history-less media branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, os.getcwd())
          from reels import curriculum, hosting, site, state
          d = "/tmp/site"; site.build(curriculum.load(), state.load(), d)
          hosting.publish([], d)
          print("media branch ready")
          PY
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f "source[branch]=media" -f "source[path]=/" \
            && echo "Pages now serves the media branch" \
            || echo "::warning::Could not switch GitHub Pages automatically. Settings -> Pages -> Branch: media, folder: / (root)"

      - name: Render a full-quality preview of the new lesson style (not published)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m reels.sample || echo "::warning::preview failed (the installed system is fine)"

      - name: Keep the old bot off
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable daily-content.yml || true
