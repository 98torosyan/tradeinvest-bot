name: music-fetch
# Downloads the curated Pixabay tracks listed in reels/assets/music/pixabay_list.tsv (Pixabay Content License,
# no Content ID) into reels/assets/music/lesson/ and commits them. Run manually.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tracks
        run: |
          mkdir -p reels/assets/music/lesson
          while IFS=$'\t' read -r id url name; do
            [ -z "$id" ] && continue
            out="reels/assets/music/lesson/user_px-${name}-${id}.mp3"
            [ -f "$out" ] && continue
            curl -fsSL -A "Mozilla/5.0" -e "https://pixabay.com/" -o "$out" "$url" && echo "ok $name" || echo "FAIL $name"
          done < reels/assets/music/pixabay_list.tsv
          ls -la reels/assets/music/lesson
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Mood library from Pixabay search
        run: |
          pip install -q requests
          python -m reels.music_pixabay
          find reels/assets/music/moods -name "*.mp3" | sort
      - name: Commit
        run: |
          git config user.name "tradeinvest-bot"; git config user.email "actions@users.noreply.github.com"
          git add reels/assets/music/lesson reels/assets/music/moods
          git commit -m "music: Pixabay tracks" || echo "nothing to commit"
          git pull --rebase && git push
