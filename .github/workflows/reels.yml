name: TradeInvest Reels

# UTC times. Yerevan = UTC+4 (no DST). Odd minutes on purpose (GitHub delays runs on the hour).
#   08:37 market story | 09:07 12:07 15:07 18:07 21:07 lessons | 10:37 16:37 20:07 news
#   13:37 quiz story   | 19:37 BTC 24h story | Sunday 11:37 weekly carousel
on:
  schedule:
    - cron: "37 4 * * *"
    - cron: "7 5,8,11,14,17 * * *"
    - cron: "37 6,12 * * *"
    - cron: "7 16 * * *"
    - cron: "37 9 * * *"
    - cron: "37 15 * * *"
    - cron: "37 7 * * 0"
  workflow_dispatch:
    inputs:
      kind:
        description: "what to publish"
        required: true
        default: "lesson"
        type: choice
        options: [lesson, news, story, chart, quiz, carousel]

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reels/requirements.txt
      - name: Decide what to post
        run: |
          KIND="${{ github.event.inputs.kind }}"
          if [ -z "$KIND" ]; then
            case "${{ github.event.schedule }}" in
              "37 4 * * *") KIND=story ;;
              "7 5,8,11,14,17 * * *") KIND=lesson ;;
              "37 9 * * *") KIND=quiz ;;
              "37 15 * * *") KIND=chart ;;
              "37 7 * * 0") KIND=carousel ;;
              *) KIND=news ;;
            esac
          fi
          echo "KIND=$KIND" >> "$GITHUB_ENV"
      - name: Install ffmpeg, Python deps and headless Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r reels/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build, check and publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          git config user.name "tradeinvest-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -z "$GEMINI_MODEL" ] && unset GEMINI_MODEL
          python -m reels.run --kind "$KIND"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-${{ github.run_id }}
          path: output/reels/*.mp4
          retention-days: 5
          if-no-files-found: ignore
