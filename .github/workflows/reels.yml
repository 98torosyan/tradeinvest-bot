name: TradeInvest Reels

# UTC times. Yerevan = UTC+4 (no DST). Odd minutes on purpose (GitHub delays runs on the hour).
#   08:37 market story | 12:37 19:07 21:37 trading Reels | 10:37 16:37 22:07 news Stories
#   13:37 quiz story   | 19:37 BTC 24h story | Mon/Wed/Fri 15:07 educational carousel
#   17:37 daily analysis Reel (Remotion, real candles; before the US open)
on:
  schedule:
    - cron: "37 4 * * *"
    - cron: "37 8,17 * * *"
    - cron: "7 15 * * *"
    - cron: "37 6 * * *"
    - cron: "7 18 * * *"
    - cron: "37 9 * * *"
    - cron: "7 11 * * 1,3,5"
    - cron: "7 13 * * 0"
    - cron: "7 6 * * *"
    - cron: "7 8 1 * *"
    - cron: "7 12 * * *"
    - cron: "7 11 * * 0,2,4,6"
    - cron: "53 17 * * *"
    - cron: "23 * * * *"
    - cron: "37 13 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "what to publish"
        required: true
        default: "lesson"
        type: choice
        options: [lesson, news, story, chart, quiz, carousel, analysis, music, selftest, stories_pack, report_dry, weekly, challenge, alert, monthly, econ_dry, fact, poster, digest, yt_check]

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-24.04            # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reels/requirements.txt
      - name: Decide what to post
        run: |
          KIND="${{ github.event.inputs.kind }}"
          if [ -z "$KIND" ]; then
            case "${{ github.event.schedule }}" in
              "37 4 * * *") KIND=story ;;
              "37 8,17 * * *") KIND=lesson ;;
              "7 15 * * *") KIND=lesson ;;
              "37 9 * * *") KIND=quiz ;;
              "7 11 * * 1,3,5") KIND=carousel ;;
              "7 13 * * 0") KIND=weekly ;;
              "7 6 * * *") KIND=challenge ;;
              "7 8 1 * *") KIND=monthly ;;
              "7 12 * * *") KIND=fact ;;
              "7 11 * * 0,2,4,6") KIND=poster ;;
              "53 17 * * *") KIND=digest ;;
              "23 * * * *") KIND=alert ;;
              "37 13 * * *") KIND=analysis ;;
              *) KIND=news ;;
            esac
          fi
          echo "KIND=$KIND" >> "$GITHUB_ENV"
          if [ "$KIND" = "alert" ]; then          # cheap pre-check: skip the whole run unless BTC/ETH moved >= 5 % in 24 h
            MOVE=0
            for S in BTCUSDT ETHUSDT; do
              P=$(curl -s "https://data-api.binance.vision/api/v3/ticker/24hr?symbol=$S" | jq -r '.priceChangePercent | tonumber | if . < 0 then -. else . end')
              echo "$S 24h move: $P%"
              if [ -n "$P" ] && [ "$(echo "$P >= 5" | bc -l)" = "1" ]; then MOVE=1; fi
            done
            [ "$MOVE" = "0" ] && echo "SKIP=1" >> "$GITHUB_ENV"
          fi
          true
      - uses: actions/setup-node@v4
        if: env.KIND == 'analysis' || env.KIND == 'lesson' || env.KIND == 'weekly'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: Install Remotion
        if: env.KIND == 'analysis' || env.KIND == 'lesson' || env.KIND == 'weekly'
        run: cd remotion && npm ci --no-audit --no-fund && npx remotion browser ensure
      - name: Install system tools, Python deps and headless Chromium
        if: env.SKIP != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg hunspell libcairo2-dev libpango1.0-dev pkg-config
          mkdir -p ~/.fonts && (cp reels/assets/ttf/*.ttf ~/.fonts/ 2>/dev/null || true) && (fc-cache -f >/dev/null || true)
          pip install -q -r reels/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build, check and publish
        if: env.SKIP != '1'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          SCHEDULED: ${{ github.event.schedule }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          git config user.name "tradeinvest-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -z "$GEMINI_MODEL" ] && unset GEMINI_MODEL
          if [ "$KIND" = "selftest" ]; then python -m reels.selftest; exit $?; fi      # checks only, publishes nothing
          python -m reels.run --kind "$KIND"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-${{ github.run_id }}
          path: |
            output/reels/*.mp4
            output/reels/*-week.jpg
          retention-days: 5
          if-no-files-found: ignore
