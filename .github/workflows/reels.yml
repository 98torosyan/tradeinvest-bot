name: TradeInvest Reels

# Times are UTC. Yerevan = UTC+4 (no DST).
#   story:   08:37 Yerevan ("Շուկան այսօր")
#   chart:   19:37 Yerevan ("Bitcoin 24 ժամում" candle story)
#   lessons: 09:07 12:07 15:07 18:07 21:07 Yerevan (the course, in order)
#   news:    10:37 16:37 20:07 Yerevan
# Odd minutes on purpose: GitHub often delays or drops runs scheduled exactly on the hour.
on:
  schedule:
    - cron: "37 4 * * *"             # market story
    - cron: "37 15 * * *"            # bitcoin 24h candle story
    - cron: "7 5,8,11,14,17 * * *"   # lessons
    - cron: "37 6,12 * * *"          # news
    - cron: "7 16 * * *"             # news
  workflow_dispatch:
    inputs:
      kind:
        description: "lesson, news, story or chart"
        required: true
        default: "lesson"
        type: choice
        options: [lesson, news, story, chart]

permissions:
  contents: write

concurrency:
  group: reels            # one reel at a time, so git pushes never collide
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reels/requirements.txt

      - name: Decide what to post
        run: |
          KIND="${{ github.event.inputs.kind }}"
          if [ -z "$KIND" ]; then
            case "${{ github.event.schedule }}" in
              "7 5,8,11,14,17 * * *") KIND=lesson ;;
              "37 4 * * *") KIND=story ;;
              "37 15 * * *") KIND=chart ;;
              *) KIND=news ;;
            esac
          fi
          echo "KIND=$KIND" >> "$GITHUB_ENV"
          echo "Posting a $KIND reel"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps + headless Chromium
        run: |
          pip install -r reels/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build, render and publish the reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          git config user.name "tradeinvest-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -z "$GEMINI_MODEL" ] && unset GEMINI_MODEL
          python -m reels.run --kind "$KIND"

      - name: Keep the rendered reel as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: output/reels/
          retention-days: 7
