name: TradeInvest Watchdog

# Hourly health check (+1 automatic retry of a missed lesson); Sunday 22:00 Yerevan: weekly report + technical check.
on:
  schedule:
    - cron: "23 * * * *"
    - cron: "0 18 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests feedparser
      - env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 18 * * 0" ]; then
            python -m reels.watchdog --weekly
            python -m reels.report || true
          else
            python -m reels.watchdog
          fi
